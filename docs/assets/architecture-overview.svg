<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">AI-Native Test Design architecture</title>
  <desc id="desc">Requirement evidence becomes a formatted acceptance criteria source, then functional tests. Functional tests feed deterministic export, automation analysis, and regression design. Related Story evidence informs functional and regression design.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-text { font-size: 13px; fill: #475569; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #818cf8; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1320" height="720" rx="28" fill="url(#background)"/>
  <text x="64" y="74" class="label title">AI-Native Test Design</text>
  <text x="64" y="104" class="label subtitle">Evidence-first functional design, automation analysis, and release regression composition</text>

  <text x="64" y="164" class="label section">REQUIREMENT EVIDENCE</text>
  <text x="440" y="164" class="label section">FUNCTIONAL SOURCE OF TRUTH</text>
  <text x="878" y="164" class="label section">SPECIALIZED OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="64" y="190" width="246" height="104" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="64" y="190" width="10" height="104" rx="5" fill="#2563eb"/>
    <text x="94" y="232" class="label node-title">Requirement evidence</text>
    <text x="94" y="258" class="label node-text">Story, AC, confirmed notes,</text>
    <text x="94" y="278" class="label node-text">and referenced screenshots</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="380" width="246" height="104" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="64" y="380" width="10" height="104" rx="5" fill="#2563eb"/>
    <text x="94" y="422" class="label node-title">Related Story evidence</text>
    <text x="94" y="448" class="label node-text">Explicit prerequisites in</text>
    <text x="94" y="468" class="label node-text">Story, AC, and notes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="190" width="310" height="104" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="390" y="190" width="10" height="104" rx="5" fill="#4f46e5"/>
    <text x="420" y="232" class="label node-title">Formatted acceptance criteria</text>
    <text x="420" y="258" class="label node-text">Lossless transcription of the</text>
    <text x="420" y="278" class="label node-text">immutable dated raw snapshot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="380" width="310" height="126" rx="18" fill="#312e81"/>
    <rect x="390" y="380" width="10" height="126" rx="5" fill="#a5b4fc"/>
    <text x="420" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Functional-test-design skill</text>
    <text x="420" y="452" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e0e7ff">Complete Story-level scenarios</text>
    <text x="420" y="474" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e0e7ff">from explicit business evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="330" width="224" height="118" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="760" y="330" width="10" height="118" rx="5" fill="#4f46e5"/>
    <text x="790" y="372" class="label node-title">Functional feature</text>
    <text x="790" y="398" class="label node-text">Story-level Gherkin</text>
    <text x="790" y="418" class="label node-text">is the source of truth</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="184" width="214" height="108" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <rect x="1050" y="184" width="10" height="108" rx="5" fill="#16a34a"/>
    <text x="1080" y="226" class="label node-title">Deterministic CLI</text>
    <text x="1080" y="252" class="label node-text">Lint, export, and</text>
    <text x="1080" y="272" class="label node-text">explicit Jira synchronization</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="352" width="214" height="108" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <rect x="1050" y="352" width="10" height="108" rx="5" fill="#ea580c"/>
    <text x="1080" y="394" class="label node-title">Automation analysis</text>
    <text x="1080" y="420" class="label node-text">Layer recommendation and</text>
    <text x="1080" y="440" class="label node-text">evidence-status matrix</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="520" width="214" height="108" rx="18" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
    <rect x="1050" y="520" width="10" height="108" rx="5" fill="#db2777"/>
    <text x="1080" y="562" class="label node-title">Regression design</text>
    <text x="1080" y="588" class="label node-text">Release mapping, compact</text>
    <text x="1080" y="608" class="label node-text">suite, and Jira summary</text>
  </g>

  <path d="M310 242 H390" class="edge"/>
  <path d="M545 294 V380" class="edge"/>
  <path d="M310 432 H350 V443 H390" class="edge-dashed"/>
  <path d="M700 443 H760" class="edge"/>
  <path d="M984 366 H1020 V238 H1050" class="edge"/>
  <path d="M984 389 H1050" class="edge"/>
  <path d="M872 448 V490 H1157 V520" class="edge"/>
  <path d="M187 484 V574 H1050" class="edge-dashed"/>
  <text x="560" y="564" class="label node-text">cross-Story context</text>

  <rect x="64" y="632" width="820" height="42" rx="12" fill="#e0e7ff"/>
  <circle cx="90" cy="653" r="6" fill="#4f46e5"/>
  <text x="108" y="658" class="label node-text">Solid arrows: deterministic artifact flow</text>
  <circle cx="410" cy="653" r="6" fill="#818cf8"/>
  <text x="428" y="658" class="label node-text">Dashed arrows: related evidence informs agent judgment</text>
</svg>
