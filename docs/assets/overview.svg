<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">AI-Native Test Design overview</title>
  <desc id="d">A Jira Story and related rules from the Requirement Wiki go to the functional-test-design skill. A human reviews the BDD cases and requirement questions. Reviewed cases go to Jira and Zephyr, to test layer analysis, and to release regression design.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .col { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .bt { font-size: 17px; font-weight: 700; }
      .bx { font-size: 14px; fill: #475569; }
      .big { font-size: 30px; font-weight: 700; fill: #15803d; }
      .ln { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="66" class="h1">AI-Native Test Design</text>
  <text x="48" y="96" class="sub">From a Jira Story to reviewed BDD test cases, test layers, and release regression suites</text>

  <text x="48" y="146" class="col">INPUT</text>
  <text x="340" y="146" class="col">AGENT SKILL</text>
  <text x="670" y="146" class="col">HUMAN</text>
  <text x="920" y="146" class="col">OUTPUT</text>

  <rect x="48" y="160" width="240" height="100" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="68" y="196" class="bt">Jira Story</text>
  <text x="68" y="222" class="bx">AC, confirmed notes,</text>
  <text x="68" y="242" class="bx">and screenshots</text>

  <rect x="48" y="290" width="240" height="100" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="68" y="326" class="bt">Requirement Wiki</text>
  <text x="68" y="352" class="bx">Related rules from other</text>
  <text x="68" y="372" class="bx">Stories, with sources</text>

  <rect x="340" y="160" width="280" height="230" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="362" y="196" class="bt">functional-test-design</text>
  <text x="362" y="232" class="bx">1. Organize test points</text>
  <text x="362" y="262" class="bx">2. Record requirement questions</text>
  <text x="362" y="292" class="bx">3. Write BDD .feature cases</text>
  <text x="362" y="322" class="bx">4. Check AC traceability</text>
  <text x="362" y="352" class="bx">5. Run an independent review</text>

  <rect x="670" y="160" width="200" height="230" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="690" y="196" class="bt">Human review</text>
  <text x="690" y="232" class="bx">Answer requirement</text>
  <text x="690" y="252" class="bx">questions</text>
  <text x="690" y="288" class="bx">Approve the cases</text>
  <text x="690" y="324" class="bx">Approve each</text>
  <text x="690" y="344" class="bx">Jira write</text>

  <rect x="920" y="160" width="232" height="66" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="938" y="187" class="bt">Jira and Zephyr</text>
  <text x="938" y="210" class="bx">jira cli uploads the cases</text>
  <rect x="920" y="242" width="232" height="66" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="938" y="269" class="bt">Test layers</text>
  <text x="938" y="292" class="bx">automation-coverage-analysis</text>
  <rect x="920" y="324" width="232" height="66" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="938" y="351" class="bt">Release regression</text>
  <text x="938" y="374" class="bx">regression-suite-design</text>
  <text x="920" y="416" class="bx">BDD cases → ai-native-ui-automation</text>

  <path class="ln" d="M288 210 C314 210 314 240 338 240"/>
  <path class="ln" d="M288 340 C314 340 314 310 338 310"/>
  <path class="ln" d="M620 275 L668 275"/>
  <path class="ln" d="M870 275 C895 275 895 193 918 193"/>
  <path class="ln" d="M870 275 L918 275"/>
  <path class="ln" d="M870 275 C895 275 895 357 918 357"/>

  <rect x="48" y="450" width="530" height="110" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="482" class="col">EVAL: CHECKS PASSED</text>
  <text x="70" y="526" class="big">85% → 96%</text>
  <text x="270" y="512" class="bx">without the skill → with the skill</text>
  <text x="270" y="534" class="bx">4 tasks × 3 runs, 165 checks</text>

  <rect x="622" y="450" width="530" height="110" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="644" y="482" class="col">DESIGN RULES</text>
  <text x="644" y="510" class="bx">Requirements guide test design.</text>
  <text x="644" y="530" class="bx">Implementation architecture guides test layers.</text>
  <text x="644" y="550" class="bx">Business risk guides regression selection.</text>
</svg>
